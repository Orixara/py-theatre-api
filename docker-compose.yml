services:
   app:
       build:
           context: .
           args:
             INSTALL_DEV: "true"
       ports:
           - "8000:8000"
       command: >
           sh -c "python manage.py wait_for_db &&
                  python manage.py migrate &&
                  python manage.py runserver 0.0.0.0:8000"
       volumes:
         - media_files:/app/media
       env_file:
           - .env
       depends_on:
           - db

   db:
       image: postgres:17-alpine
       ports:
           - "5433:5432"
       volumes:
           - postgres_data:/var/lib/postgresql/data
       env_file:
           - .env

volumes:
 postgres_data:
 media_files: